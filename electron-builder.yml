# electron-builder config — Halo (Linux .deb only for now)
# Never run with GH_TOKEN set: it makes electron-builder attempt a GitHub
# publish and fail the build. Releases are cut separately.
appId: org.xvoidsx.halo
productName: Halo
copyright: Copyright (c) 2026 xvoidsx
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
  # node-pty is a native module: the built .node binary must ship with
  # the app, and it cannot load from inside the asar archive.
  - node_modules/node-pty/**
asarUnpack:
  - node_modules/node-pty/**
linux:
  category: Development
  syncDesktopName: true
  target:
    - target: deb
      arch:
        - x64
        - arm64
deb:
  maintainer: xvoidsx <rav3ndust.xyz@yandex.com>
  # Keep the deb gzip-compressed (dpkg-deb here defaults to zstd, which
  # older dpkg cannot read). Verify with `dpkg-deb --info` before shipping.
  compression: gz
  # Heal directory permissions after install: dpkg never fixes the mode
  # of a directory that already exists, so upgrades over the umask-007
  # 0.1.0/0.1.1 packages left /opt/Halo untraversable (770). See
  # scripts/after-install.sh.
  afterInstall: scripts/after-install.sh
